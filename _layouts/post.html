<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Amarnath Chakraborty</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.6; color: #24292e; background-color: #fff; margin: 0; padding: 0; }
        a { color: #0366d6; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .wrapper { display: flex; max-width: 900px; margin: 60px auto; padding: 0 20px; gap: 50px; }
        .sidebar { width: 200px; flex-shrink: 0; position: sticky; top: 60px; height: max-content; }
        .sidebar h1 { font-size: 1.4rem; margin: 0 0 6px 0; font-weight: 600; line-height: 1.2; }
        .sidebar p { font-size: 0.9rem; color: #586069; margin: 0 0 16px 0; }
        .content { flex-grow: 1; max-width: 600px; }
        .content h2 { font-size: 1.5rem; font-weight: 600; border-bottom: 1px solid #eaecef; padding-bottom: 8px; margin-bottom: 16px; margin-top: 0; }
        .post-meta { color: #586069; font-style: italic; margin-bottom: 30px; display: block; }
        .content img { max-width: 100%; border-radius: 6px; margin: 20px 0; }
        @media (max-width: 768px) { .wrapper { flex-direction: column; margin: 40px auto; gap: 40px; } .sidebar { width: 100%; position: relative; top: 0; } }
    </style>
</head>
<body>
<div class="wrapper">
    <aside class="sidebar">
        <h1>The Notebook</h1>
        <p>Personal logs and explorations.</p>
        <nav>
            <a href="../notebook/index.html">&larr; Back to Notebook</a><br><br>
            <a href="../index.html">&larr; Academic Profile</a>
        </nav>
    </aside>
    <main class="content">
        <h2>{{ page.title }}</h2>
        <span class="post-meta">{{ page.date | date: "%B %d, %Y" }} &middot; {{ page.category }}</span>
        
        {{ content }}

    </main>
</div>
</body>
</html>
